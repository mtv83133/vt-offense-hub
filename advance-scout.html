<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --m:#861F41;--m-dark:#3D0A1E;--o:#E5751F;--bg:#1B1B2F;--card:#242438;--txt:#FFFFFF;--muted:#AAA8C2;
  --bdr:#3A3A58;--good:#2E9E4F;--goodbg:rgba(46,158,79,.18);--warn:#E8A33D;--warnbg:rgba(232,163,61,.18);
  --bad:#E5484D;--badbg:rgba(229,72,77,.18);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);display:flex;min-height:100vh;font-size:14px}
/* SIDEBAR */
#sb{width:210px;min-width:210px;background:linear-gradient(180deg,var(--m-dark) 0%,var(--m) 100%);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sb-logo{padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.15);display:flex;align-items:center;gap:10px}
.sb-logo-badge{background:var(--o);color:var(--m-dark);font-size:15px;font-weight:900;width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid rgba(255,255,255,.2)}
.sb-team{color:#fff;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.sb-sub{color:rgba(255,255,255,.5);font-size:10px;margin-top:1px}
.year-sel{margin:10px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#fff;font-size:12px;font-weight:700;padding:6px 8px;width:calc(100% - 28px)}
.year-sel option{color:#1a1a1a}
.no-data-state{text-align:center;padding:70px 24px}
.no-data-state h2{font-size:16px;font-weight:800;color:var(--muted);margin-bottom:8px}
.no-data-state p{font-size:12.5px;color:var(--muted);line-height:1.8;max-width:480px;margin:0 auto}
.no-data-state .nd-icon{font-size:40px;margin-bottom:14px}
.no-data-cta{margin-top:18px;display:inline-block;background:var(--m);color:#fff;padding:9px 20px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.team-content{display:none}
.team-content.on{display:block}
.sb-sec{padding:12px 14px 3px;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35)}
.nav{display:block;padding:9px 14px;color:rgba(255,255,255,.75);text-decoration:none;font-size:12.5px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:all .1s}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:rgba(232,119,34,.2);color:var(--o);border-left-color:var(--o);font-weight:700}
.nav.sub{padding-left:26px;font-size:12px}
/* MAIN */
#main{margin-left:210px;flex:1;display:flex;flex-direction:column;min-height:100vh}
/* TOP BAR */
#tbar{background:var(--card);border-bottom:1px solid var(--bdr);padding:10px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.tbar-opp{flex:1}
.tbar-name{font-size:20px;font-weight:900;color:var(--m);line-height:1}
.tbar-info{font-size:11px;color:var(--muted);margin-top:2px}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:700;transition:all .12s;letter-spacing:.3px}
.btn-m{background:var(--m);color:#fff}.btn-m:hover{background:#5c1221}
.btn-o{background:var(--o);color:#fff}.btn-o:hover{background:#cc6b1d}
.btn-out{background:transparent;color:var(--m);border:2px solid var(--m)}.btn-out:hover{background:var(--m);color:#fff}
/* CONTENT */
#content{padding:20px 22px;flex:1}
#content.drag-over{outline:3px dashed var(--o);outline-offset:-8px;background:rgba(232,119,34,.05)}
/* SECTIONS */
.sec{display:none}.sec.on{display:block}
/* CARD */
.card{background:var(--card);border-radius:10px;padding:18px;border:1px solid var(--bdr)}
.card-hd{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:10px}
/* SECTION HEADER */
.sec-hd{margin-bottom:18px}
.sec-title{font-size:18px;font-weight:900;color:var(--m);text-transform:uppercase;letter-spacing:.5px}
.sec-line{height:3px;background:linear-gradient(90deg,var(--m),var(--o));margin:4px 0 14px;border-radius:2px;width:60px}
/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
/* STAT CARDS */
.scard{background:var(--card);border-radius:10px;padding:14px 16px;border:1px solid var(--bdr);border-left:4px solid var(--bdr)}
.scard.good{border-left-color:var(--good)}.scard.bad{border-left-color:var(--bad)}.scard.warn{border-left-color:var(--warn)}
.sl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.sv{font-size:20px;font-weight:900;margin:3px 0}
.sr{display:flex;gap:6px;flex-wrap:wrap}
.rb{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700}
.rb.c{background:rgba(255,255,255,.08);color:var(--muted)}
.rb.ng{background:var(--goodbg);color:var(--good)}.rb.nb{background:var(--badbg);color:var(--bad)}.rb.nw{background:var(--warnbg);color:var(--warn)}
/* FAST FACTS */
.ff{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bdr)}
.ff:last-child{border-bottom:none}
.ff-dot{width:22px;height:22px;border-radius:50%;background:var(--m);color:var(--o);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;margin-top:1px}
.ff-text{font-size:12.5px;line-height:1.55}
.hl{color:var(--o);font-weight:700}.hlg{color:var(--good);font-weight:700}.hlb{color:var(--bad);font-weight:700}
/* EXPLOIT */
.exploit{background:linear-gradient(135deg,#0f2d0f,#1a4a1a);color:#fff;border-radius:10px;padding:18px}
.exploit-hd{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#86efac;margin-bottom:12px}
.ex-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.ex-item:last-child{border-bottom:none}
.ex-arr{color:#86efac;font-weight:900;font-size:14px;flex-shrink:0}
.ex-txt{font-size:12.5px;line-height:1.4}
.ex-txt strong{color:#fde68a}
/* TABLES */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--m);color:#fff;padding:8px 11px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.tbl td{padding:8px 11px;border-bottom:1px solid var(--bdr)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.tbl tr:hover td{background:rgba(255,255,255,.05)}
.tbl td.b{font-weight:700}.tbl td.c{text-align:center}.tbl td.r{text-align:right}
/* SUB TABS */
.stabs{display:flex;gap:0;margin-bottom:18px;border-bottom:2px solid var(--bdr)}
.stab{padding:9px 18px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .1s}
.stab:hover{color:var(--m)}.stab.on{color:var(--m);border-bottom-color:var(--o);font-weight:800}
.stcon{display:none}.stcon.on{display:block}
.tm-mode-toggle{display:flex;gap:8px;margin-bottom:18px}
.tm-mode-btn{padding:8px 20px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--card);border:2px solid var(--bdr);border-radius:20px;transition:all .1s}
.tm-mode-btn:hover{color:var(--m);border-color:var(--m)}
.tm-mode-btn.on{color:#fff;background:var(--m);border-color:var(--m)}
.tm-mode-wrap{display:none}.tm-mode-wrap.on{display:block}
/* PRESSURE CARDS */
.pcard{background:var(--card);border-radius:10px;padding:16px;text-align:center;border:1px solid var(--bdr)}
.ppct{font-size:32px;font-weight:900;line-height:1}
.plbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:4px}
.pcnt{font-size:11px;color:var(--muted);margin-top:2px}
.pcard.int .ppct{color:var(--bad)}.pcard.fld .ppct{color:var(--m)}.pcard.bnd .ppct{color:var(--warn)}.pcard.dbl .ppct{color:var(--o)}
/* ZONE CARDS */
.zcard{border-radius:10px;padding:18px;border:1px solid var(--bdr)}
.zcard.outer{background:rgba(229,117,31,.12);border:2px solid var(--o)}
.zcard.inner{background:rgba(220,38,38,.12);border:2px solid #dc2626}
.zcard.score{background:rgba(127,29,29,.18);border:2px solid #7f1d1d}
.zcard.gl{background:var(--m);color:#fff}
.zhd{font-size:13px;font-weight:900;text-transform:uppercase;margin-bottom:10px}
.zcard.outer .zhd{color:var(--m)}.zcard.inner .zhd{color:#dc2626}.zcard.score .zhd{color:#7f1d1d}.zcard.gl .zhd{color:var(--o)}
/* BIBLE TAB (coverage cross-tab reference) */
.bib-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bib-card{padding:12px}
.bib-body{font-size:11px;max-height:480px;overflow-y:auto}
.bib-row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.bib-hdr{font-weight:800;color:var(--txt);border-top:1px solid var(--bdr);padding-top:6px;margin-top:6px}
.bib-grp:first-child>.bib-hdr{border-top:none;margin-top:0;padding-top:0}
.bib-sub{font-weight:700;padding-left:10px;color:var(--txt)}
.bib-leaf{padding-left:18px;color:var(--muted);font-size:10px}
.bib-lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bib-n{color:var(--muted);white-space:nowrap}
.bib-pct{font-weight:700;white-space:nowrap;min-width:38px;text-align:right;color:var(--o);border-radius:3px;padding:0 4px}
.bib-pct.p-hot{background:rgba(229,72,77,.28);color:#ff9599}
.bib-pct.p-warm{background:rgba(232,163,61,.26);color:#f7c877}
.bib-pct.p-mild{background:rgba(232,163,61,.12);color:#e8d6a3}
.bib-pct.p-cool{background:none;color:var(--muted)}
.bib-empty{color:var(--muted);padding:6px 0;font-size:11px}
.bib-notes{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);padding:10px;font-size:12px;font-family:inherit;resize:vertical}
.pn-attach-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pn-attach-row:empty{margin-top:0}
.pn-attach-chip{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:6px 8px;font-size:11px;max-width:170px}
.pn-attach-chip img{width:36px;height:36px;object-fit:cover;border-radius:5px;flex-shrink:0}
.pn-attach-chip .pn-file-icon{width:36px;height:36px;border-radius:5px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.pn-attach-chip .pn-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--txt)}
.pn-attach-chip .pn-remove{cursor:pointer;color:var(--bad);font-weight:800;flex-shrink:0;padding:0 2px}
.pn-attach-btn{display:inline-block;background:var(--m);color:#fff;padding:7px 14px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;margin-top:10px}
.pn-attach-btn:hover{opacity:.9}
@media print{.bib-body{max-height:none;overflow:visible}}
/* BIBLE TAB v2 -- dense spreadsheet-style restyle (matches staff's original cheat-sheet look).
   New class names (bib-cols/bib-card2/bib-tbl/...) live alongside the v1 classes above so
   teams not yet migrated (still using bib-grid/bib-row/etc.) keep rendering correctly. */
.bib-cols{column-count:3;column-gap:14px}
.bib-card2{background:var(--card);border-radius:10px;padding:10px 12px;border:1px solid var(--bdr);break-inside:avoid;margin-bottom:14px;display:inline-block;width:100%}
.bib-card2 .card-hd{margin-bottom:8px}
.bib-tbl{width:100%;border-collapse:collapse;font-size:10.5px}
.bib-tbl th{background:var(--m);color:#fff;padding:3px 6px;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;text-align:left}
.bib-tbl th.bib-c{text-align:right}
.bib-tbl td{padding:2.5px 6px;border-bottom:1px solid var(--bdr);color:var(--txt)}
.bib-tbl td.bib-c{text-align:right;white-space:nowrap}
.bib-tbl tr.bib-g td{font-weight:800;background:rgba(255,255,255,.06);border-top:1px solid var(--bdr);padding-top:4px}
.bib-tbl tr.bib-g2 td{font-weight:700;background:rgba(255,255,255,.03)}
.bib-tbl tr.bib-g2 td:first-child{padding-left:14px}
.bib-tbl tr.bib-l1 td:first-child{padding-left:16px;color:var(--muted);font-size:10px}
.bib-tbl tr.bib-l2 td:first-child{padding-left:26px;color:var(--muted);font-size:10px}
.bib-tbl tr.bib-l0 td:first-child{color:var(--muted);font-size:10px}
.bib-tbl tr:last-child td{border-bottom:none}
.bib-empty2{color:var(--muted);font-style:italic;padding:4px 6px!important;font-size:10px}
/* PREPARE FOR / REACT TO / MIXERS / PRESSURE breakdown cards -- shared by the Bible
   tab's Normal Downs Breakdown by Formation and the RZ tab's zone cards. Matches the
   staff's own "Michigan Breakdown"-style situational cheat sheet. */
.prm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.prm-card{background:rgba(255,255,255,.03);border:1px solid var(--bdr);border-radius:8px;padding:8px 10px}
.prm-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;border-bottom:1px solid var(--bdr);padding-bottom:4px}
.prm-title{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--txt)}
.prm-n{font-size:9.5px;color:var(--muted);white-space:nowrap}
.prm-mini{display:flex;flex-direction:column;gap:3px}
.prm-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:10.5px}
.prm-lbl{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:.3px;white-space:nowrap}
.prm-val{text-align:right;color:var(--txt)}
.prm-pct{color:var(--muted);font-size:9.5px}
.prm-mixers{font-size:9.5px;color:var(--muted);text-align:right}
.prm-none{color:var(--muted);font-style:italic}
.prm-pressure{font-weight:800}
.prm-pn{font-weight:400;color:var(--muted);font-size:9px}
.prm-p-hi{color:var(--bad)}
.prm-p-mid{color:var(--warn)}
.prm-p-lo{color:var(--good)}
.prm-small-note{margin-top:8px;font-size:9.5px;color:var(--muted);font-style:italic;line-height:1.4}
@media print{.prm-card{break-inside:avoid;page-break-inside:avoid}.prm-grid{grid-template-columns:repeat(3,1fr)}}
@media print{.bib-cols{column-count:1;display:block}
/* Chrome's print engine doesn't reliably honor break-inside:avoid for a card
   that sits inside a CSS multi-column container -- a card near a column's
   bottom edge can still get sliced across the page boundary. Single-column
   block flow (rather than column-count:2) makes break-inside:avoid on each
   .bib-card2 reliable, at the cost of using more printed pages. */
.bib-notes{page-break-before:avoid!important;break-before:avoid!important}
.bib-card[style*="grid-column"]{page-break-before:avoid!important;break-before:avoid!important;break-inside:avoid!important;page-break-inside:avoid!important}
}
/* DEPTH CHART */
.dc-row{display:flex;gap:10px;margin-bottom:14px}
.dc-pos{flex:1;min-width:0}
.dc-lbl{background:var(--m);color:#fff;font-size:10px;font-weight:800;text-align:center;padding:4px;border-radius:4px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.dc-player{background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:6px;padding:7px 8px;margin-bottom:5px;font-size:11px;line-height:1.3}
.dc-player.s{border-left:3px solid var(--o)}
.dc-score{display:inline-block;font-weight:800;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:5px;vertical-align:1px;text-decoration:none}
.dc-score.hi{background:var(--good,#2E9E4F)33;color:#4ade80;border:1px solid var(--good,#2E9E4F)}
.dc-score.mid{background:#E8A33D33;color:#E8A33D;border:1px solid #E8A33D}
.dc-score.lo{background:rgba(255,255,255,.08);color:var(--muted);border:1px solid var(--bdr)}
.dc-num{font-weight:900;color:var(--m);font-size:12px}
.dc-name{font-weight:700}
.dc-info{color:var(--muted);font-size:10px}
.dc-player.evaluable{cursor:pointer}
.dc-player.evaluable:hover{background:rgba(255,255,255,.08);border-color:var(--o)}
.dc-grade{display:inline-block;font-weight:900;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:5px;vertical-align:1px;border:1px solid}
.dc-grade.elite{background:rgba(96,165,250,.18);color:#60a5fa;border-color:#60a5fa}
.dc-grade.good{background:var(--goodbg);color:#4ade80;border-color:var(--good)}
.dc-grade.ok{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.dc-grade.warn{background:rgba(232,117,31,.18);color:var(--o);border-color:var(--o)}
.dc-grade.bad{background:rgba(220,38,38,.18);color:#f87171;border-color:#f87171}
.dc-grade.nf{background:rgba(168,85,247,.18);color:#c084fc;border-color:#c084fc}
.dc-tap-hint{color:var(--o);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.grade-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 16px}
.legend-chip{display:flex;align-items:center;gap:7px;font-size:11px}
.legend-chip .legend-txt{color:var(--muted)}
.sl-group{margin-bottom:14px;border:1px solid var(--bdr);border-radius:8px;overflow:hidden}
.sl-hd{background:var(--m-dark);color:#fff;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.6px;padding:8px 12px}
.sl-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--bdr);font-size:12px}
.sl-row.good{background:var(--goodbg)}
.sl-row.bad{background:rgba(220,38,38,.14)}
.sl-label{font-weight:700;color:var(--txt)}
.sl-player{font-weight:800;white-space:nowrap}
.sl-row.good .sl-player{color:#4ade80}
.sl-row.bad .sl-player{color:#f87171}
.dc-links{display:flex;gap:6px;margin-top:6px}
.dc-link{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:3px 7px;border-radius:4px;text-decoration:none;border:1px solid var(--bdr);color:var(--txt);background:rgba(255,255,255,.03);transition:background .15s,border-color .15s}
.dc-link:hover{border-color:var(--m);background:rgba(255,255,255,.08)}
.dc-link.pff{border-color:var(--o);color:var(--o)}
.dc-link.pff:hover{background:rgba(232,117,31,.12)}
/* DC PROFILE HEADSHOT */
.dc-photo{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--m);flex-shrink:0;display:block;background:var(--bdr)}
.dc-photo-placeholder{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.06);border:3px dashed var(--bdr);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted);flex-shrink:0}
/* CAREER TIMELINE */
.ct-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bdr);align-items:center;font-size:12.5px}
.ct-yr{min-width:80px;font-weight:800;color:var(--m)}
.ct-school{font-weight:600;flex:1}
.ct-role{color:var(--muted);font-size:11px}
.badge{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:800;text-transform:uppercase}
.badge.nfl{background:#1e3a8a;color:#fff}.badge.col{background:var(--m);color:#fff}
/* RUN EFF BARS */
.ebar{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.ebar-lbl{min-width:90px;font-size:12px;font-weight:700}
.ebar-track{flex:1;background:rgba(255,255,255,.06);border-radius:4px;height:18px;overflow:hidden}
.ebar-fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;border-radius:4px}
.ebar-fill span{font-size:10px;font-weight:800;color:#fff}
.ebar-ct{min-width:55px;text-align:right;font-size:11px;color:var(--muted)}
/* CALLOUT */
.callout{padding:11px 14px;border-radius:8px;font-size:12.5px;line-height:1.5;margin-bottom:14px}
.callout.info{background:rgba(59,130,246,.15);border-left:4px solid #3b82f6}
.callout.warn{background:var(--warnbg);border-left:4px solid var(--o)}
.callout.danger{background:var(--badbg);border-left:4px solid var(--bad)}
.callout.success{background:var(--goodbg);border-left:4px solid var(--good)}
/* CHART */
.ch{position:relative;height:220px}
.ch-lg{position:relative;height:300px}
.ch-sm{position:relative;height:160px}
/* UTIL */
.mt8{margin-top:8px}.mt14{margin-top:14px}.mt20{margin-top:20px}
.mb8{margin-bottom:8px}.mb14{margin-bottom:14px}
.flex{display:flex}.gap10{gap:10px}.gap14{gap:14px}
.txt-sm{font-size:11.5px}.txt-xs{font-size:11px}.txt-muted{color:var(--muted)}
.fw7{font-weight:700}.fw9{font-weight:900}
/* SAVED REPORTS SIDEBAR */
.sb-save-btn{display:block;margin:10px 12px 4px;padding:8px 12px;background:rgba(232,119,34,.25);color:var(--o);font-size:12px;font-weight:800;border:1px solid rgba(232,119,34,.4);border-radius:6px;cursor:pointer;text-align:center;transition:all .12s;letter-spacing:.3px}
.sb-save-btn:hover{background:rgba(232,119,34,.4);color:#fff}
.saved-report-item{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;cursor:pointer;border-left:3px solid transparent;transition:all .1s}
.saved-report-item:hover{background:rgba(255,255,255,.07);border-left-color:rgba(255,255,255,.25)}
.saved-report-item.active-report{background:rgba(232,119,34,.15);border-left-color:var(--o)}
.sr-icon{font-size:13px;flex-shrink:0}
.sr-info{flex:1;min-width:0}
.sr-name{font-size:12px;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-date{font-size:10px;color:rgba(255,255,255,.38);margin-top:1px}
.sr-del{color:rgba(255,255,255,.25);font-size:18px;font-weight:900;line-height:1;cursor:pointer;flex-shrink:0;padding:0 3px;transition:color .1s}
.sr-del:hover{color:#ff6b6b}
.sr-empty{padding:8px 14px;font-size:11px;color:rgba(255,255,255,.3);font-style:italic}
/* SHARE MODAL */
.share-option{display:flex;align-items:center;gap:14px;padding:14px;border:2px solid var(--bdr);border-radius:8px;cursor:pointer;transition:all .12s;margin-bottom:10px}
.share-option:hover{border-color:var(--m);background:#f9f9f9}
.share-icon{font-size:28px;flex-shrink:0}
.share-title{font-size:14px;font-weight:800;color:var(--m)}
.share-desc{font-size:12px;color:var(--muted);margin-top:2px}
/* ACTIVE REPORT BADGE in top bar */
.active-badge{background:var(--goodbg);color:var(--good);font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
/* FILE DROP */
.fdrop{border:2px dashed var(--bdr);border-radius:8px;padding:18px;text-align:center;cursor:pointer;background:#fafafa;transition:all .12s}
.fdrop:hover,.fdrop.drag{border-color:var(--o);background:#fff8f3}
.fdrop input{display:none}
/* MODAL */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
.modal{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:28px;max-width:520px;width:90%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-title{font-size:17px;font-weight:900;color:var(--txt);margin-bottom:6px}
.modal-sub{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px}
.modal-close:hover{color:var(--txt)}
#modal .modal{position:relative}
.eval-hd{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.eval-name{font-size:18px;font-weight:900;color:var(--txt)}
.eval-meta{color:var(--muted);font-size:12px;margin-bottom:16px}
.eval-summary{background:rgba(255,255,255,.05);border-left:3px solid var(--o);padding:8px 12px;font-weight:800;font-size:12px;letter-spacing:.3px;color:var(--o);margin-bottom:16px;border-radius:0 6px 6px 0}
.eval-sec{margin-bottom:14px}
.eval-sec-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--o);margin-bottom:4px}
.eval-sec-txt{font-size:13px;line-height:1.5;color:var(--txt)}
/* PRINT LABEL (hidden on screen, shown in print) */
.print-label{display:none;font-size:13px;font-weight:900;color:var(--m);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--o)}
/* PRINT */
@page{margin:.5in .4in .5in .4in;size:letter portrait}

/* ================= MOBILE / RESPONSIVE ================= */
#sbToggle{display:none;position:fixed;top:12px;left:14px;z-index:300;background:var(--o);color:var(--m-dark);border:none;width:38px;height:38px;border-radius:8px;font-size:18px;font-weight:900;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.4);}
#sbOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;}
#sbOverlay.show{display:block;}
@media screen and (max-width:900px){
  #sbToggle{display:flex;}
  #sb{transform:translateX(-100%);transition:transform .22s ease;width:270px;min-width:270px;box-shadow:4px 0 24px rgba(0,0,0,.5);}
  #sb.open{transform:translateX(0);}
  #main{margin-left:0;}
  #tbar{padding-left:58px;flex-wrap:wrap;row-gap:8px;}
  #drop-hint{display:none;}
  .g2,.g3{grid-template-columns:1fr!important;}
  .g4{grid-template-columns:repeat(2,1fr)!important;}
  .g7{grid-template-columns:repeat(4,1fr)!important;gap:8px!important;}
  .stabs{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .stab{white-space:nowrap;flex-shrink:0;padding:9px 14px;}
  .dc-row{flex-wrap:wrap;}
  .dc-pos{flex:1 1 45%;min-width:130px;}
  .grade-legend{grid-template-columns:repeat(2,1fr);}
  .card{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tbl{white-space:nowrap;}
}
@media screen and (max-width:560px){
  .g4,.g7{grid-template-columns:repeat(2,1fr)!important;}
  .dc-pos{flex:1 1 100%;}
  #content{padding:14px 12px;}
  .sec-title{font-size:15px;}
  .sv{font-size:17px;}
  .card{padding:12px;}
}

/* ── PRINT LAYOUT (class-based, applied by JS before charts rebuild) ──
   Mirrors the print media query's layout-affecting rules but as a plain
   class so it takes effect BEFORE window.print() -- Chart.js needs the
   final container size at chart-creation time, not just at paint time. */
body.printing #sb,body.printing #modal,body.printing #sbToggle,body.printing #sbOverlay{display:none!important}
body.printing #main{margin-left:0!important;width:720px!important;max-width:720px!important}
body.printing #tbar{position:static!important;box-shadow:none!important}
body.printing #tbar button,body.printing #tbar .btn,body.printing #drop-hint{display:none!important}
body.printing .g7{grid-template-columns:repeat(4,1fr)!important;gap:8px!important}
body.printing .g4{grid-template-columns:repeat(2,1fr)!important}
body.printing .g3{grid-template-columns:1fr 1fr 1fr!important}
body.printing .g2{grid-template-columns:1fr 1fr!important}
body.printing .ch{height:160px!important}
body.printing .ch-lg{height:190px!important}
body.printing .ch-sm{height:95px!important}

.donut-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:3px 6px;margin-top:6px;}
.donut-legend-item{display:flex;align-items:center;gap:4px;min-width:0;}
.donut-legend-swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.donut-legend-label{font-size:8.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  /* Base theme is dark-on-navy for the screen. Redefining the theme
     variables here (rather than patching every dark surface one by one)
     flips body text, #tbar, and every .card/.scard/.pcard to a light
     background with dark text automatically, since they all read from
     these custom properties. This is what was missing before -- the old
     print block only set body{background:#fff}, never body{color:...},
     so text stayed white-on-white/white-on-dark almost everywhere. */
  :root{--bg:#ffffff;--card:#ffffff;--txt:#111111;--muted:#555555;--bdr:#cccccc;}
  body{background:#fff!important;font-size:11.5px!important;display:block!important}
  #sb,#modal,#sbToggle,#sbOverlay{display:none!important}
  #main{margin-left:0!important;display:block!important}
  #tbar{position:static!important;box-shadow:none!important;border-bottom:2px solid var(--m)!important;padding:8px 16px!important;background:#fff!important}
  #tbar button,#tbar .btn,#drop-hint{display:none!important}
  .tbar-name{font-size:18px!important}
  /* Hardcoded translucent-white overlays (designed as "light wash on a
     dark card") disappear on a white card -- give them a visible light
     gray fill instead so boxes/tracks/pills stay legible. */
  .dc-player{background:#f5f5f5!important}
  .dc-links{display:none!important}
  .dc-photo-placeholder{background:#f0f0f0!important}
  .ebar-track{background:#e5e5e5!important}
  .rb.c{background:#eeeeee!important}
  /* SECTIONS: every team now has the exact same 13-section shell (Overview/DC/Stats/Depth/
     Run/P&10/ND/CD/TM/FM/RZ/GL/Bible), populated with either that team's real report or the
     shared blank placeholder content -- so printing is uniform for every team, no
     special-casing needed. #sec-tm/#sec-fm (2-Minute/4-Minute) were missing from this
     whitelist entirely -- not broken/leaking, just never printed at all -- fixed 2026-09-01
     per Matt ("make sure 2min & 4min is included in print report again"). */
  .sec{display:none!important}
  #sec-overview,#sec-dc,#sec-stats,#sec-depth,
  #sec-run,#sec-p10,#sec-nd,#sec-cd,#sec-tm,#sec-fm,#sec-rz,#sec-gl,#sec-bible{display:block!important;page-break-before:always;break-before:page;page-break-inside:avoid;break-inside:avoid}
  #sec-overview{page-break-before:avoid;break-before:avoid}
  .sec-hd{page-break-after:avoid;break-after:avoid}
  /* SUB-TABS: hide tab buttons, show all content */
  .stabs{display:none!important}
  .tm-mode-toggle{display:none!important}
  .tm-mode-wrap{display:block!important}
  .stcon{display:block!important}
  /* Each sub-tab group also starts fresh — no bleeding between them */
  .stcon+.stcon{border-top:2px solid var(--bdr)!important;margin-top:16px!important;padding-top:14px!important;page-break-before:always;break-before:page}
  /* 2026-09-01, per Matt: 2-Minute (End of Game + End of Half) and 4-Minute should each try
     to fit onto ONE page together, the same compaction effort already given to Normal Downs
     (see the #nd-fronts/#nd-coverage/#cd-fronts/#cd-coverage block below). The generic
     .stcon+.stcon rule above forces a fresh page before EVERY sub-tab (Formations/Fronts/
     Coverage/Blitz), which is what made 2-Min alone print as 8 separate pages (4 stabs x
     EOG+EOH) and 4-Min as 4. Override that back to a light in-flow separator for TM/FM only
     (ND/CD/Depth keep the forced per-stab break, untouched) so content packs as tightly as
     the compacted font/padding sizes below allow, rather than being artificially split. */
  #sec-tm .stcon+.stcon,#sec-fm .stcon+.stcon{page-break-before:auto!important;break-before:auto!important;border-top:1px solid #ccc!important;margin-top:10px!important;padding-top:8px!important}
  /* 2-Minute's End of Half wrap is a SEPARATE sibling from End of Game's (#tm-eog-wrap /
     #tm-eoh-wrap are two different .tm-mode-wrap divs, not two .stcon siblings inside the
     same wrap) -- the .stcon+.stcon rule above does NOT reach across that boundary. Previously
     forced onto its own fresh page (page-break-before:always); now given the same light
     in-flow separator as the stab-to-stab override above, so End of Half continues packing
     onto the same page as End of Game whenever the compacted content allows it. */
  #tm-eoh-wrap{border-top:2px solid #999!important;margin-top:12px!important;padding-top:10px!important}
  .print-label{display:block!important}
  /* CARDS — never break mid-card */
  .card,.scard{box-shadow:none!important;border:1px solid #d1d5db!important;break-inside:avoid;page-break-inside:avoid}
  .zcard{box-shadow:none!important;break-inside:avoid}
  /* Grids don't break mid-row */
  .g2,.g3,.g4,.g7{break-inside:avoid;page-break-inside:avoid}
  /* Tables don't break mid-row */
  .tbl tr{break-inside:avoid;page-break-inside:avoid}
  .exploit{background:#0f2d0f!important;color:#fff!important;break-inside:avoid}
  .exploit *{color:inherit}
  .exploit .exploit-hd{color:#86efac!important}
  .exploit .ex-arr{color:#86efac!important}
  .zcard.gl{background:var(--m)!important;color:#fff!important}
  .zcard.gl *{color:#fff}
  .zcard.gl .zhd{color:var(--o)!important}
  /* TABLE COLORS PRESERVED */
  .tbl th{background:var(--m)!important;color:#fff!important;-webkit-print-color-adjust:exact!important}
  .tbl tr:nth-child(even) td{background:#f9fafb!important}
  .zcard.gl .tbl tr:nth-child(even) td{background:transparent!important}
  .tbl{break-inside:avoid;font-size:11px!important}
  /* PCARD COLORS */
  .pcard.int .ppct{color:var(--bad)!important}
  .pcard.fld .ppct{color:var(--m)!important}
  .pcard.bnd .ppct{color:var(--warn)!important}
  .pcard.dbl .ppct{color:var(--o)!important}
  /* RANK BADGES */
  .rb.ng{background:var(--goodbg)!important;color:var(--good)!important}
  .rb.nb{background:var(--badbg)!important;color:var(--bad)!important}
  .rb.nw{background:var(--warnbg)!important;color:var(--warn)!important}
  /* CALLOUTS */
  .callout{border-left:4px solid currentColor!important}
  .callout.danger{background:var(--badbg)!important;border-color:var(--bad)!important}
  .callout.warn{background:var(--warnbg)!important;border-color:var(--o)!important}
  .callout.info{background:#eff6ff!important;border-color:#3b82f6!important}
  .callout.success{background:var(--goodbg)!important;border-color:var(--good)!important}
  /* STAT BORDER COLORS */
  .scard.good{border-left:4px solid var(--good)!important}
  .scard.bad{border-left:4px solid var(--bad)!important}
  .scard.warn{border-left:4px solid var(--warn)!important}
  /* GRID REFLOW FOR LETTER PAPER */
  .g7{grid-template-columns:repeat(4,1fr)!important;gap:8px!important}
  .g4{grid-template-columns:repeat(2,1fr)!important}
  .g3{grid-template-columns:1fr 1fr 1fr!important}
  .g2{grid-template-columns:1fr 1fr!important}
  /* CHART HEIGHTS */
  .ch{height:160px!important}
  .ch-lg{height:190px!important}
  .ch-sm{height:95px!important}
  /* MARGINS */
  .mt20{margin-top:12px!important}
  .mt14{margin-top:10px!important}
  .mb14{margin-bottom:10px!important}
  /* DC CAREER */
  .ct-item{font-size:11px!important;padding:5px 0!important}
  /* DEPTH CHART */
  .dc-row{flex-wrap:wrap!important}
  .dc-player{font-size:10px!important;padding:5px!important}
  /* EFF BARS */
  .ebar-fill span{font-size:9px!important}

  /* Fit Overview and the Blitz sub-tabs on a single printed page each */
  #sec-overview .card,#sec-overview .exploit{padding:8px 10px!important}
  #sec-overview .card-hd,#sec-overview .exploit-hd{margin-bottom:4px!important}
  #sec-overview .g7{gap:6px!important}
  #sec-overview .g2,#sec-overview .g4{gap:8px!important}
  #sec-overview .mb14{margin-bottom:6px!important}
  #sec-overview .mt14{margin-top:6px!important}
  #sec-overview .sv{font-size:15px!important}
  #sec-overview .scard{padding:8px 10px!important}
  #sec-overview .ff{padding:3px 0!important}
  #sec-overview .ex-item{padding:3px 0!important}
  #weekly-notes{font-size:10.5px!important;line-height:1.35!important}
  #sec-overview .ff-text,#sec-overview .ex-txt{font-size:10px!important;line-height:1.3!important}
  #sec-overview .sec-hd{margin-bottom:6px!important}
  #sec-overview .sec-title{font-size:15px!important}
  /* Situation Quick Reference is the last block on the Overview page and
     was the one tipping the whole page over -- compact its wrapper card
     and, since its title/line divs are built with inline styles (no
     class to hook besides .txt-sm), target them positionally. */
  #sec-overview .card.mt14{margin-top:4px!important;padding:6px 8px!important}
  #sit-ref{gap:6px!important}
  #sit-ref .card{padding:5px 7px!important}
  #sit-ref .card>div:first-child{font-size:10px!important;margin-bottom:3px!important;padding-bottom:2px!important}
  #sit-ref .txt-sm{font-size:8.5px!important;padding:1px 0!important;line-height:1.25!important}
  #nd-blitz .card,#cd-blitz .card{padding:8px 10px!important}
  #nd-blitz .card-hd,#cd-blitz .card-hd{margin-bottom:4px!important;font-size:9px!important}
  #nd-blitz .g4,#cd-blitz .g4{gap:6px!important}
  #nd-blitz .g2,#cd-blitz .g2{gap:8px!important}
  #nd-blitz .pcard,#cd-blitz .pcard{padding:8px!important}
  #nd-blitz .ppct,#cd-blitz .ppct{font-size:20px!important}
  #nd-blitz .plbl,#cd-blitz .plbl{font-size:9px!important}
  #nd-blitz .tbl,#cd-blitz .tbl{font-size:9px!important}
  #nd-blitz .tbl th,#cd-blitz .tbl th{padding:4px 6px!important}
  #nd-blitz .tbl td,#cd-blitz .tbl td{padding:3px 6px!important}
  #nd-blitz .mb14,#cd-blitz .mb14{margin-bottom:6px!important}
  /* ZONE CARDS */
  .zcard.outer{background:#fff7ed!important;border:2px solid var(--o)!important}
  .zcard.inner,.zcard.score{background:#fef2f2!important;border:2px solid #dc2626!important}

  /* ---- 2026-08-30: fit Depth Chart / Roster / Matchups / ND-CD Fronts+Coverage each on
     one printed page, hide Player Notes and the 2026 Coaching Staff card from print ---- */
  /* Depth Chart: shrink the grading-scale legend so it + all 3 position cards fit on one page */
  #grade-legend-card{padding:6px 10px!important;margin-bottom:6px!important}
  #grade-legend-card .card-hd{margin-bottom:4px!important;font-size:10.5px!important}
  .grade-legend{grid-template-columns:repeat(6,1fr)!important;gap:3px 8px!important}
  .legend-chip{gap:3px!important;font-size:9.5px!important}
  .legend-chip .dc-grade{font-size:9px!important;padding:1px 5px!important;margin-left:0!important}
  .legend-chip .legend-txt{font-size:8.5px!important}
  #depth-chart .card{padding:7px 9px!important}
  #depth-chart .card-hd{font-size:11px!important;margin-bottom:4px!important}
  #depth-chart .dc-row{gap:4px!important}
  #depth-chart .dc-player{font-size:9.5px!important;padding:5px!important}
  #depth-chart .mt14{margin-top:6px!important}

  /* Roster tab: the 2026 Defensive Coaching Staff card isn't needed on the printed report --
     with it hidden, the remaining 5 cards (Attrition/NFL Draft Picks/Number Changes/Position
     Changes/All-Conference, in that order) need to be compact enough to fit one page together. */
  #rc-coaching-staff{display:none!important}
  #depth-roster .card{padding:5px 8px!important}
  #depth-roster .card-hd{font-size:9.5px!important;margin-bottom:3px!important}
  #depth-roster .tbl{font-size:8.5px!important}
  #depth-roster .tbl th,#depth-roster .tbl td{padding:2px 6px!important}
  #depth-roster .mt14{margin-top:4px!important}
  #depth-roster .dc-info{font-size:8.5px!important;margin-bottom:2px!important}
  #depth-roster .g2{gap:6px!important}

  /* Matchups tab: fit Best/Toughest Matchups + Superlatives on one page together */
  #depth-matchups .card{padding:7px 9px!important}
  #depth-matchups .card-hd{font-size:11px!important;margin-bottom:4px!important}
  #depth-matchups .tbl{font-size:9.5px!important}
  #depth-matchups .tbl th,#depth-matchups .tbl td{padding:4px 6px!important}
  #depth-matchups .mt14{margin-top:6px!important}
  #depth-matchups .sl-group{margin-bottom:4px!important;border-radius:4px!important}
  #depth-matchups .sl-hd{font-size:10px!important;padding:5px 9px!important}
  #depth-matchups .sl-row{font-size:9.5px!important;padding:3px 9px!important}
  #depth-matchups .g2{gap:8px!important}

  /* Player Notes: coach-only editing surface with attachments -- never print */
  #depth-notes{display:none!important}

  /* Normal Downs / Conversion Downs: Fronts and Coverage sub-tabs each fit on one page.
     NOTE: .ch-sm height is intentionally NOT overridden here -- it must stay in sync with
     the 95px value that body.printing sets (see body.printing .ch-sm rule above), because
     Chart.js/the custom donut-legend both measure and rasterize against that 95px box
     BEFORE @media print rules apply (see printDashboard()). A different height here would
     shrink the box after the canvas/legend were already laid out, causing the donut and its
     legend to overlap the next card -- that was the misalignment bug on this print run. */
  #nd-fronts .card,#nd-coverage .card,#cd-fronts .card,#cd-coverage .card{padding:7px 9px!important}
  #nd-fronts .card-hd,#nd-coverage .card-hd,#cd-fronts .card-hd,#cd-coverage .card-hd{font-size:10.5px!important;margin-bottom:4px!important}
  #nd-fronts .tbl,#nd-coverage .tbl,#cd-fronts .tbl,#cd-coverage .tbl{font-size:9.5px!important}
  #nd-fronts .tbl th,#nd-fronts .tbl td,#nd-coverage .tbl th,#nd-coverage .tbl td,#cd-fronts .tbl th,#cd-fronts .tbl td,#cd-coverage .tbl th,#cd-coverage .tbl td{padding:3px 6px!important}
  #nd-fronts .g2,#nd-coverage .g2,#cd-fronts .g2,#cd-coverage .g2{gap:6px!important}
  #nd-fronts .mb14,#nd-coverage .mb14,#cd-fronts .mb14,#cd-coverage .mb14{margin-bottom:6px!important}
  #nd-fronts .donut-legend,#nd-coverage .donut-legend,#cd-fronts .donut-legend,#cd-coverage .donut-legend{margin-top:4px!important}
  #nd-fronts .donut-legend-label,#nd-coverage .donut-legend-label,#cd-fronts .donut-legend-label,#cd-coverage .donut-legend-label{font-size:9px!important}

  /* ---- 2026-09-01: 2-Minute (End of Game + End of Half together) and 4-Minute compacted
     the same way as ND/CD's Fronts/Coverage above, per Matt -- tighter still, since the goal
     here is packing MULTIPLE stab categories (Formations/Fronts/Coverage/Blitz), and for
     2-Min both EOG and EOH, onto shared pages rather than just one stab per page. Paired with
     the .stcon+.stcon / #tm-eoh-wrap page-break overrides above (auto instead of forced) so
     there's no artificial break stopping content from packing this tight.
     NOTE: chart heights (.ch/.ch-lg/.ch-sm) are deliberately NOT overridden here -- see the
     comment on the ND/CD block above for why a print-media-only height override would cause
     the donut/legend misalignment bug (Chart.js sizes the canvas from the body.printing rule,
     which applies before @media print takes effect, not from this block). ---- */
  #sec-tm .card,#sec-fm .card{padding:6px 8px!important}
  #sec-tm .card-hd,#sec-fm .card-hd{font-size:10px!important;margin-bottom:3px!important}
  #sec-tm .tbl,#sec-fm .tbl{font-size:9px!important}
  #sec-tm .tbl th,#sec-tm .tbl td,#sec-fm .tbl th,#sec-fm .tbl td{padding:2px 5px!important}
  #sec-tm .g2,#sec-fm .g2{gap:5px!important}
  #sec-tm .mb14,#sec-fm .mb14{margin-bottom:5px!important}
  #sec-tm .mt14,#sec-fm .mt14{margin-top:5px!important}
  #sec-tm .callout,#sec-fm .callout{padding:6px 9px!important;font-size:10px!important;margin-bottom:6px!important;line-height:1.3!important}
  #sec-tm .donut-legend,#sec-fm .donut-legend{margin-top:3px!important}
  #sec-tm .donut-legend-label,#sec-fm .donut-legend-label{font-size:8px!important}
  #sec-tm .print-label,#sec-fm .print-label{font-size:11px!important;margin:8px 0 5px!important}
  #tm-manzone-callout,#fm-manzone-callout{padding:5px 8px!important;font-size:9.5px!important;margin-bottom:6px!important}
  #sec-tm .tm-mode-wrap{margin-bottom:0!important}
}

/* PRINT COVER PAGE -- screen-hidden always; shown only when printing, as the very first
   page (page-break-after:always pushes the rest of the printed report onto page 2+).
   Reusable week to week: only pc-vt-... text is static (VT wordmark never changes), the
   opponent logo image + fallback initials swap per team via renderPrintCover(). */
.print-cover{display:none}
@media print{
  .print-cover{
    display:flex!important;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:100vh;
    background:#ffffff!important;
    page-break-after:always;
    break-after:page;
    padding:60px 20px;
    box-sizing:border-box;
  }
  .pc-vt-word{text-align:center;margin-bottom:64px}
  .pc-vt-main{font-size:48px;font-weight:900;color:#E5751F!important;letter-spacing:2px;line-height:1;font-family:inherit}
  .pc-vt-sub{font-size:22px;font-weight:800;color:#111111!important;letter-spacing:6px;margin-top:8px}
  .pc-logo-wrap{width:320px;height:320px;display:flex;align-items:center;justify-content:center;margin-bottom:56px;position:relative}
  .pc-logo-img{max-width:100%;max-height:100%;object-fit:contain;display:none}
  .pc-logo-img.loaded{display:block}
  .pc-logo-fallback{width:280px;height:280px;border-radius:50%;background:#861F41!important;display:flex;align-items:center;justify-content:center}
  .pc-logo-fallback span{font-size:72px;font-weight:900;color:#fff!important;letter-spacing:2px}
  .pc-report-title{font-size:26px;font-weight:800;color:#111111!important;text-decoration:underline;letter-spacing:1px;text-align:center}
}

  }

  function deriveKey(password, saltBytes) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function(baseKey){
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      });
  }

  function decryptPayload(password) {
    var payload = JSON.parse(document.getElementById('vtLockPayload').textContent);
    var salt = b64ToBytes(payload.salt);
    var iv = b64ToBytes(payload.iv);
    var ct = b64ToBytes(payload.ct);
    return deriveKey(password, salt).then(function(key){
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    }).then(function(plainBuf){
      return new TextDecoder().decode(plainBuf);
    });
  }

  function reveal(html) {
    document.body.innerHTML = html;
    var scripts = Array.prototype.slice.call(document.body.querySelectorAll('script'));
    scripts.forEach(function(oldScript){
      var newScript = document.createElement('script');
      for (var i = 0; i < oldScript.attributes.length; i++) {
        var attr = oldScript.attributes[i];
        newScript.setAttribute(attr.name, attr.value);
      }
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }

  function attemptUnlock(password, opts) {
    opts = opts || {};
    return decryptPayload(password).then(function(html){
      try { sessionStorage.setItem(SS_KEY, password); } catch(e) {}
      reveal(html);
      return true;
    }).catch(function(){
      if (!opts.silent) {
        var err = document.getElementById('vtLockErr');
        if (err) err.textContent = 'Incorrect password. Try again.';
        var input = document.getElementById('vtLockInput');
        if (input) { input.value = ''; input.focus(); }
      }
      return false;
    });
  }

  function wireUpUI() {
    var btn = document.getElementById('vtLockBtn');
    var input = document.getElementById('vtLockInput');
    if (btn) btn.addEventListener('click', function(){ attemptUnlock(input.value); });
    if (input) input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') attemptUnlock(input.value);
    });
  }

  var stored = null;
  try { stored = sessionStorage.getItem(SS_KEY); } catch(e) {}
  if (stored) {
    attemptUnlock(stored, { silent: true }).then(function(ok){
      if (!ok) wireUpUI();
    });
  } else {
    wireUpUI();
  }
})();
</script>
</body></html>
