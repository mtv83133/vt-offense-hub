<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VT Football | Scouting Hub</title>

<!-- Add to Home Screen support -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3D0A1E">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VT Offense">

<style>
:root {
  --maroon: #861F41; --maroon-dark: #3D0A1E; --orange: #E5751F;
  --navy: #1B1B2F; --card: #242438; --card2: #2D2D45;
  --border: #3A3A58; --text: #FFFFFF; --dim: #AAA8C2; --muted: #666485;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--navy);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
.hdr{background:linear-gradient(135deg,var(--maroon-dark) 0%,var(--maroon) 100%);border-bottom:3px solid var(--orange);padding:20px 24px;box-shadow:0 4px 24px rgba(0,0,0,0.7);}
.hdr-inner{display:flex;align-items:center;gap:16px;max-width:1100px;margin:0 auto;}
.vt-logo{background:var(--orange);color:var(--maroon-dark);font-size:26px;font-weight:900;width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0;border:2px solid rgba(255,255,255,0.2);}
.hdr-title h1{font-size:20px;font-weight:800;letter-spacing:.5px;}
.hdr-title p{font-size:11px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1.5px;margin-top:3px;}
main{flex:1;max-width:1100px;margin:0 auto;padding:48px 24px;width:100%;display:flex;align-items:center;justify-content:center;}
@media screen and (max-width:520px){
  .hdr{padding:14px 16px;}
  .vt-logo{width:42px;height:42px;font-size:20px;}
  .hdr-title h1{font-size:15px;}
  .hdr-title p{font-size:9px;}
  main{padding:28px 16px;}
}
footer{text-align:center;padding:20px;color:var(--muted);font-size:11px;border-top:1px solid var(--border);}

/* ── Gate box (password entry) ── */
.gate-wrap{width:100%;max-width:380px;}
.gate-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px 32px;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,.6);}
.gate-icon{background:var(--orange);color:var(--maroon-dark);font-size:24px;font-weight:900;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:10px;margin:0 auto 18px;}
.gate-box h2{font-size:16px;font-weight:800;letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase;}
.gate-box p{color:var(--dim);font-size:12px;margin-bottom:20px;}
.gate-input{width:100%;background:var(--navy);border:1px solid var(--border);border-radius:8px;color:#fff;padding:12px 14px;font-size:14px;margin-bottom:12px;font-family:inherit;}
.gate-input:focus{outline:none;border-color:var(--orange);}
.gate-btn{width:100%;background:var(--orange);color:var(--maroon-dark);border:none;border-radius:8px;padding:12px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:filter .15s;}
.gate-btn:hover{filter:brightness(1.1);}
.gate-btn:active{filter:brightness(.95);}
.gate-btn:disabled{opacity:.6;cursor:default;}
.gate-err{color:#ff8080;font-size:11px;margin-top:10px;min-height:14px;}
.gate-foot{color:var(--muted);font-size:10px;margin-top:18px;}

/* ── Staff chooser (shown after staff password matches) ── */
.chooser{width:100%;max-width:640px;}
.chooser-intro{text-align:center;margin-bottom:28px;}
.chooser-intro h2{font-size:20px;font-weight:800;margin-bottom:6px;}
.chooser-intro p{color:var(--dim);font-size:12px;}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media screen and (max-width:560px){.cards{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;text-decoration:none;color:var(--text);display:block;transition:transform .15s, border-color .15s;border-top:4px solid var(--border);}
.card:hover{transform:translateY(-3px);border-top-color:var(--orange);}
.card-icon{font-size:30px;margin-bottom:12px;}
.card h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.card p{font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:14px;}
.card-cta{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--orange);}

.hidden{display:none !important;}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div class="vt-logo">VT</div>
    <div class="hdr-title">
      <h1>VT FOOTBALL SCOUTING HUB</h1>
      <p>Internal Use Only</p>
    </div>
  </div>
</header>

<main>

  <!-- Password gate -->
  <div class="gate-wrap" id="gateWrap">
    <div class="gate-box">
      <div class="gate-icon">VT</div>
      <h2>Scouting Hub</h2>
      <p>Internal use only. Enter your password to continue.</p>
      <input id="gateInput" type="password" class="gate-input" placeholder="Password" autocomplete="off" autofocus>
      <button id="gateBtn" type="button" class="gate-btn">Continue</button>
      <div id="gateErr" class="gate-err"></div>
      <div class="gate-foot">VT Football &middot; Internal Use Only</div>
    </div>
  </div>

  <!-- Staff chooser: intentionally EMPTY in the served HTML. Built dynamically via JS
       only after the staff password is confirmed, so no dashboard names/links are ever
       present in page source pre-auth (view-source stays blank, matching the old fully
       encrypted hub's guarantee). -->
  <div class="chooser hidden" id="chooserWrap"></div>

</main>

<footer>VT Football &nbsp;·&nbsp; Internal Use Only</footer>

<!-- Encrypted payloads: the staff payload's plaintext IS the chooser HTML (dashboard names
     and links), so nothing about page names/links exists anywhere in this file until the
     staff password successfully decrypts it. The player payload is a tiny known-plaintext
     blob (not real content) used only to confirm the player password before redirecting. -->

<script id="playerPayload" type="application/json">{"salt":"OrShVGZxFBvr5ppAIaaMjw==","iv":"HPwqYKua9nAC09F7","ct":"pNNzqGFhLfS91SdGxmPLcTB98WW8xKFJAw==","it":300000}</script>

<script>
(function(){
  var SS_KEY = 'vt_scout_pw_v1'; // same key lock_page.js's overlay reads on self-scout/advance-scout/player-view

  function b64ToBytes(str) {
    var bin = atob(str);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function deriveKey(password, saltBytes, iterations) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function(baseKey){
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: saltBytes, iterations: iterations, hash: 'SHA-256' },
          baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
      });
  }
  function tryDecrypt(elId, password) {
    var payload = JSON.parse(document.getElementById(elId).textContent);
    var salt = b64ToBytes(payload.salt), iv = b64ToBytes(payload.iv), ct = b64ToBytes(payload.ct);
    return deriveKey(password, salt, payload.it).then(function(key){
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    }).then(function(buf){
      return new TextDecoder().decode(buf);
    }).catch(function(){ return null; });
  }

  function showChooser(html) {
    var wrap = document.getElementById('chooserWrap');
    if (!wrap.childElementCount) wrap.innerHTML = html; // build once from decrypted plaintext
    document.getElementById('gateWrap').classList.add('hidden');
    wrap.classList.remove('hidden');
  }

  function attempt(password, opts) {
    opts = opts || {};
    var btn = document.getElementById('gateBtn');
    var err = document.getElementById('gateErr');
    if (btn) btn.disabled = true;
    return tryDecrypt('staffPayload', password).then(function(chooserHtml){
      if (chooserHtml !== null) {
        try { sessionStorage.setItem(SS_KEY, password); } catch(e) {}
        showChooser(chooserHtml);
        return true;
      }
      return tryDecrypt('playerPayload', password).then(function(playerCheck){
        if (playerCheck === 'PLAYER_OK') {
          try { sessionStorage.setItem(SS_KEY, password); } catch(e) {}
          window.location.href = 'player-view.html';
          return true;
        }
        if (!opts.silent) {
          if (err) err.textContent = 'Incorrect password. Try again.';
          var input = document.getElementById('gateInput');
          if (input) { input.value = ''; input.focus(); }
        }
        return false;
      });
    }).finally(function(){ if (btn) btn.disabled = false; });
  }

  var btn = document.getElementById('gateBtn');
  var input = document.getElementById('gateInput');
  if (btn) btn.addEventListener('click', function(){ attempt(input.value); });
  if (input) input.addEventListener('keydown', function(e){ if (e.key === 'Enter') attempt(input.value); });

  // If a password from a previous unlock this session is already stored, skip straight past
  // the prompt (mirrors the auto-unlock behavior on the other 3 pages).
  var stored = null;
  try { stored = sessionStorage.getItem(SS_KEY); } catch(e) {}
  if (stored) attempt(stored, { silent: true });
})();
</script>

</body>
